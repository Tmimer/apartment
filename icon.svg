<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151b2e"/>
      <stop offset="50%" stop-color="#1f1830"/>
      <stop offset="100%" stop-color="#2a1829"/>
    </linearGradient>

    <!-- Roof Gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Wall Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Leaf 2 Gradient -->
    <linearGradient id="leaf2Grad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Heart Glow Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Subtle Ambient Glow Behind House -->
  <circle cx="256" cy="270" r="140" fill="rgba(251, 113, 133, 0.12)" filter="url(#glow)"/>
  <circle cx="295" cy="180" r="90" fill="rgba(16, 185, 129, 0.15)" filter="url(#glow)"/>

  <!-- Chimney -->
  <g filter="url(#softShadow)">
    <rect x="306" y="170" width="36" height="60" rx="8" fill="#e11d48"/>
    <rect x="302" y="164" width="44" height="12" rx="6" fill="#fb7185"/>
  </g>

  <!-- Floating Heart Steam from Chimney -->
  <path d="M324 135 C324 130 318 126 313 129 C308 132 308 138 313 143 L324 153 L335 143 C340 138 340 132 335 129 C330 126 324 130 324 135 Z" fill="#fda4af" opacity="0.85"/>
  <path d="M342 108 C342 104 337 101 333 103 C329 105 329 110 333 114 L342 122 L351 114 C355 110 355 105 351 103 C347 101 342 104 342 108 Z" fill="#f43f5e" opacity="0.6"/>

  <!-- Sprouting Green Leaves (Behind/Through Roof) -->
  <g filter="url(#softShadow)">
    <!-- Main Leaf -->
    <path d="M256 195 C256 140 310 95 350 90 C355 130 320 185 268 198 Z" fill="url(#leafGrad)"/>
    <path d="M256 195 C280 165 315 135 348 92" stroke="#a7f3d0" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    
    <!-- Secondary Leaf -->
    <path d="M262 190 C240 150 195 125 170 130 C175 165 210 195 254 195 Z" fill="url(#leaf2Grad)"/>
    <path d="M256 192 C230 175 200 160 172 132" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Little Sprout Stem Base -->
    <path d="M256 220 Q256 190 262 185" stroke="#059669" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Cozy House Base / Walls -->
  <g filter="url(#softShadow)">
    <rect x="156" y="240" width="200" height="150" rx="28" fill="url(#wallGrad)"/>
    
    <!-- Warm Wooden Foundation Line -->
    <path d="M156 366 Q256 372 356 366 L356 372 C356 382 346 390 334 390 L178 390 C166 390 156 382 156 372 Z" fill="#fbcfe8"/>
  </g>

  <!-- Cozy Sloping Gable Roof -->
  <g filter="url(#softShadow)">
    <path d="M132 248 L244 148 C251 142 261 142 268 148 L380 248 C388 255 383 268 372 268 L140 268 C129 268 124 255 132 248 Z" fill="url(#roofGrad)"/>
    <!-- Roof highlight trim -->
    <path d="M144 252 L248 160 C253 156 259 156 264 160 L368 252" stroke="rgba(255,255,255,0.4)" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- House Door (Arched) -->
  <path d="M228 320 Q228 300 256 300 Q284 300 284 320 L284 388 L228 388 Z" fill="#f43f5e" opacity="0.9"/>
  <circle cx="274" cy="350" r="3.5" fill="#fef08a"/>

  <!-- Glowing Heart Center Window in the Gable -->
  <g filter="url(#glow)">
    <!-- Heart Path centered at (256, 218) -->
    <path d="M256 208 C256 198 244 190 234 196 C224 202 224 214 234 224 L256 244 L278 224 C288 214 288 202 278 196 C268 190 256 198 256 208 Z" fill="url(#heartGrad)"/>
    <!-- Heart Specular Highlight -->
    <circle cx="242" cy="204" r="3" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- Sparkle Accents -->
  <!-- Top Left Sparkle -->
  <path d="M120 160 Q120 172 108 172 Q120 172 120 184 Q120 172 132 172 Q120 172 120 160 Z" fill="#fde047" opacity="0.85"/>
  <!-- Top Right Sparkle -->
  <path d="M396 150 Q396 160 386 160 Q396 160 396 170 Q396 160 406 160 Q396 160 396 150 Z" fill="#6ee7b7" opacity="0.85"/>
  <!-- Bottom Small Heart -->
  <path d="M126 315 C126 311 122 308 119 310 C116 312 116 316 119 319 L126 325 L133 319 C136 316 136 312 133 310 C130 308 126 311 126 315 Z" fill="#f43f5e" opacity="0.6"/>
</svg>
