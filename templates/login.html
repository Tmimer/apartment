<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <title>Apartment Passcode | Tamir &amp; Mikush</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --card-border: #1f2a44;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.25);
      --rose: #f43f5e;
      --rose-glow: rgba(244, 63, 94, 0.25);
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      padding-top: calc(20px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }
    .app-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 12px rgba(16, 185, 129, 0.3));
    }
    .title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      text-align: center;
    }
    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      text-align: center;
    }
    /* Profile Selection */
    .profile-section {
      width: 100%;
      margin-bottom: 20px;
    }
    .profile-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      margin-bottom: 8px;
      text-align: center;
    }
    .profile-switcher {
      display: flex;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-full);
      padding: 4px;
      gap: 4px;
    }
    .profile-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: var(--radius-full);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .profile-btn.active {
      background: var(--emerald);
      color: #042f2e;
      box-shadow: 0 2px 10px var(--emerald-glow);
    }
    /* Passcode form */
    .form-group {
      width: 100%;
      margin-bottom: 20px;
    }
    .passcode-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 1.1rem;
      font-family: inherit;
      text-align: center;
      letter-spacing: 0.1em;
      outline: none;
      transition: border-color 0.2s;
    }
    .passcode-input:focus {
      border-color: var(--emerald);
      box-shadow: 0 0 0 3px var(--emerald-glow);
    }
    .passcode-input::placeholder {
      letter-spacing: normal;
      color: var(--text-dim);
      font-size: 0.9rem;
    }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #042f2e;
      border: none;
      border-radius: var(--radius-md);
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px var(--emerald-glow);
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    /* Error message */
    .error-box {
      width: 100%;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      margin-top: 14px;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <img src="/icon-192.png" alt="Apartment Hub Logo" width="56" height="56" style="border-radius:14px; margin-bottom:12px; box-shadow:0 6px 18px rgba(0,0,0,0.35); display:inline-block; object-fit:cover;" onerror="this.onerror=null; this.src='/icon.svg';">
    <h1 class="title">Apartment Hub</h1>
    <p class="subtitle">Shared home for Tamir &amp; Mikush</p>

    <div class="profile-section">
      <div class="profile-label">Select Your Profile</div>
      <div class="profile-switcher">
        <button type="button" class="profile-btn active" id="btn-tamir" onclick="selectUser('Tamir')">
          <span>👤</span> Tamir
        </button>
        <button type="button" class="profile-btn" id="btn-mikush" onclick="selectUser('Mikush')">
          <span>🌸</span> Mikush
        </button>
      </div>
    </div>

    <form style="width: 100%;" onsubmit="handleLogin(event)">
      <div class="form-group">
        <input 
          type="password" 
          id="passcode-input" 
          class="passcode-input" 
          placeholder="Enter apartment passcode" 
          required 
          autocomplete="current-password" 
          autofocus
        />
      </div>

      <button type="submit" id="btn-submit" class="btn-submit">
        <span>Unlock Apartment</span> ➔
      </button>

      <div id="error-box" class="error-box"></div>
    </form>
  </div>

  <script>
    let activeProfile = localStorage.getItem('apartment_user') || 'Tamir';

    function selectUser(user) {
      activeProfile = user;
      localStorage.setItem('apartment_user', user);
      document.getElementById('btn-tamir').classList.toggle('active', user === 'Tamir');
      document.getElementById('btn-mikush').classList.toggle('active', user === 'Mikush');
    }

    // Initialize switcher state
    selectUser(activeProfile);

    async function handleLogin(e) {
      e.preventDefault();
      const input = document.getElementById('passcode-input');
      const errBox = document.getElementById('error-box');
      const btn = document.getElementById('btn-submit');
      const passcode = input.value.trim();

      if (!passcode) return;

      btn.disabled = true;
      btn.innerText = "Checking...";
      errBox.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passcode: passcode })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || "Incorrect passcode");
        }

        // Store profile and redirect
        localStorage.setItem('apartment_user', activeProfile);
        const urlParams = new URLSearchParams(window.location.search);
        const nextUrl = urlParams.get('next') || '/';
        window.location.href = nextUrl;
      } catch (err) {
        errBox.innerText = err.message;
        errBox.style.display = 'block';
        input.select();
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Unlock Apartment</span> ➔';
      }
    }
  </script>
</body>
</html>
